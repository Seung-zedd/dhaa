llm:
    mode: ""
    team_mode: ""
    glm_env_var: GLM_API_KEY
    performance_tier: medium
    claude_models:
        # Use generation-agnostic aliases only. Pinning a version ID (e.g.
        # claude-opus-4-7) contradicts model-policy.md and goes stale on every
        # model release. Aliases always resolve to the current generation.
        high: opus
        medium: sonnet
        low: haiku
    glm:
        base_url: https://api.z.ai/api/anthropic
        models:
            high: glm-5.1
            medium: glm-4.7
            low: glm-4.5-air
            opus: glm-5.1
            sonnet: glm-4.7
            haiku: glm-4.5-air
    default_model: sonnet
    quality_model: opus
    speed_model: haiku
